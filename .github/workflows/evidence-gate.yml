name: Evidence Bundle Validation (dark-factory)

permissions:
  contents: read
  pull-requests: read

on:
  workflow_dispatch:
    inputs:
      pr_sha:
        description: "PR head commit SHA (for manual evidence gate on config-only PRs)"
        required: false
        type: string
  pull_request:
    paths:
      - "runner/**"
      - "daemon/**"
      - ".github/workflows/evidence-gate.yml"

jobs:
  validate-evidence-bundles:
    name: Evidence Gate
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout repository
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          # fetch-depth: 0 so `git diff origin/<base_ref>...<sha>` resolves on
          # a freshly-created local base ref (issue #424 finding 1).
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure base ref for diff
        # actions/checkout@4 creates origin/<base_ref> but not always a local
        # <base_ref> ref. We need a local ref so `git diff` works against it.
        run: |
          base_ref="${{ github.base_ref }}"
          if [ -n "$base_ref" ]; then
            git fetch origin "$base_ref" || true
            git show-ref --verify --quiet "refs/remotes/origin/$base_ref" \
              && git branch -f "$base_ref" "origin/$base_ref" || true
          fi

      - name: PR diff summary
        run: |
          base_ref="${{ github.base_ref }}"
          head_sha="${{ github.sha }}"
          echo "PR #${{ github.event.pull_request.number }} on ${{ github.repository }} head=${head_sha}"
          if [ -n "$base_ref" ]; then
            echo "Files changed against origin/${base_ref}:"
            git --no-pager diff --name-only "origin/${base_ref}...${head_sha}" | head -50
          else
            echo "workflow_dispatch run — base ref not applicable."
          fi

      - name: Ironclad acceptance reminder
        run: |
          cat <<'EOF'
          Ironclad binding: for runner/daemon/.github/workflows/ changes, the PR must
          satisfy /green 8-PRODUCTION tier. The 8 gates mirror the canonical
          `GateName` set in `daemon/src/verifier.rs` and the `REQUIRED_KEYS`
          contract in `daemon/factory-overlay.sh`:
            1. CI green
            2. No merge conflicts
            3. CodeRabbit APPROVED
            4. Bugbot clean (zero error-severity)
            5. Inline comments resolved
            6. /er Evidence review PASS (this gate's parent trigger)
            7. Skeptic (daemon-side, see `daemon/src/verifier.rs::GateName::Skeptic`
               and the deleted `.github/workflows/skeptic-gate.yml` from PR #407 —
               the GH workflow was removed; the daemon gate remains)
            8. Vacuous red/green (daemon-side, runtime vacuous-test detector
               added in PR #387 — `GateName::VacuousRedGreen`)
          The /er command on the PR fetches the evidence-review-bot verdict.
          EOF

      - name: Determine evidence verdict from external signals
        # Issue #424 + #433: the gate must be bound to independent ground
        # truth, not to its own template. We accept EITHER of two external
        # signals, each hardened against forgery:
        #
        #   A. An `/er PASS|FAIL|PARTIAL|INCONCLUSIVE` verdict comment
        #      posted on the PR by the daemon's er_runner
        #      (`daemon/src/er_runner.rs`), which marks its body with the
        #      literal `🤖 **[dark-factory /er]**` allowlist marker (issue
        #      #433). The marker is the binding identity check: the daemon
        #      posts via the operator's `gh` account, so the author login
        #      is NOT a discriminator — the literal marker IS.
        #      Additionally, the verdict is bound to the CURRENT head SHA
        #      via the PR's `.head.sha` field. A `/er PASS` whose body
        #      references an OLDER head SHA does not green the gate.
        #
        #   B. A canonical evidence marker in the PR body of the form
        #      `**Evidence**: <gist-url>` pointing at a public, non-empty,
        #      SUBSTANTIVE GitHub Gist (issue #433). Substantive means:
        #        (i) aggregate content size >= MIN_GIST_SIZE bytes across
        #            all files (placeholder gists fail), AND
        #       (ii) at least one file references the PR number or the
        #            repo slug (the gist must be evidence for THIS PR).
        #
        # A PR with NEITHER signal fails closed.
        #
        # Note: for `pull_request` triggers, `github.sha` is the synthetic
        # merge ref SHA (`refs/pull/N/merge`), not the actual branch tip.
        # We do NOT cross-check gist content against `github.sha`. We DO
        # cross-check the verdict comment's `head <sha>` token against
        # the PR's `.head.sha` field (via `gh api pulls/{n}`), which is
        # the branch tip at the moment the workflow ran.
        if: github.event_name == 'pull_request'
        id: verdict
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
          # Minimum aggregate content size (bytes) across all gist files
          # for Signal B. 256 bytes is well above any placeholder stub
          # but well below real pytest output, command transcripts, or
          # log captures (issue #433).
          MIN_GIST_SIZE: "256"
        run: |
          set -euo pipefail

          ER_VERDICT=""        # set if (A) is found
          MARKER_VERDICT=""    # set if (B) is found and verifies

          # Fetch the PR's current head SHA so we can verify that any
          # `/er` verdict comment references the SAME head the gate is
          # running on (issue #433). A stale `/er PASS` from an older
          # head must not green the gate.
          pr_head_sha="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/pulls/${PR_NUMBER}" \
            --jq '.head.sha // ""' 2>/dev/null)" || pr_head_sha=""
          pr_head_short="$(echo "${pr_head_sha}" | cut -c1-7)"
          echo "pr_head_sha=${pr_head_sha:-<none>} pr_head_short=${pr_head_short:-<none>}"

          # --- Signal A: /er verdict comment on the PR (hardened, issue #433) ---
          # Identity check: only comments carrying the literal er_runner
          # allowlist marker `🤖 **[dark-factory /er]**` (or its
          # bracket-stripped form `[dark-factory /er]`) are considered.
          # Head-SHA check: the comment must reference the current head
          # SHA via a `head <sha>` token. Stale-head verdicts are
          # rejected.
          comments_json="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/issues/${PR_NUMBER}/comments?per_page=100" \
            --jq '[.[] | {login: .user.login, body: .body}]' 2>/dev/null)" || comments_json="[]"

          if [ -n "${pr_head_sha}" ] && [ "${comments_json}" != "[]" ]; then
            for row in $(echo "${comments_json}" | jq -c '.[]' 2>/dev/null); do
              c_body="$(echo "${row}" | jq -r '.body // ""')"
              c_login="$(echo "${row}" | jq -r '.login // ""')"

              # Skip comments that do NOT carry the er_runner allowlist
              # marker (issue #433 identity binding).
              if ! echo "${c_body}" | grep -qF '🤖 **[dark-factory /er]**' \
                 && ! echo "${c_body}" | grep -qF '[dark-factory /er]'; then
                echo "skip_comment author=${c_login} reason=no_er_runner_marker"
                continue
              fi

              # Extract any `head <sha>` token (full or short) from the
              # comment body. Accept either `head <40hex>` or
              # `head <7hex>` so the daemon's hash formats both pass.
              c_head_sha="$(echo "${c_body}" | \
                grep -oiE 'head[[:space:]]+[0-9a-f]{7,40}' | \
                awk '{print $2}' | head -1 || true)"

              # The comment must reference the CURRENT head SHA. If the
              # comment has no head SHA token, treat it as stale (issue
              # #433: stale-head verdicts must not green the gate).
              if [ -z "${c_head_sha}" ]; then
                echo "skip_comment author=${c_login} reason=no_head_sha_token"
                continue
              fi
              if [ "${c_head_sha}" != "${pr_head_sha}" ] \
                 && [ "${c_head_sha}" != "${pr_head_short}" ]; then
                echo "skip_comment author=${c_login} reason=stale_head c_head_sha=${c_head_sha} pr_head_sha=${pr_head_sha}"
                continue
              fi

              # Trusted + fresh: parse the verdict token from the
              # verbatim reply.
              if echo "${c_body}" | grep -qiE '/er[[:space:]]+PASS\b'; then
                ER_VERDICT="PASS"
                echo "signal_a_trusted_er_verdict=PASS author=${c_login} head_sha=${c_head_sha}"
                break
              elif echo "${c_body}" | grep -qiE '/er[[:space:]]+FAIL\b'; then
                ER_VERDICT="FAIL"
                echo "signal_a_trusted_er_verdict=FAIL author=${c_login} head_sha=${c_head_sha}"
                break
              elif echo "${c_body}" | grep -qiE '/er[[:space:]]+PARTIAL\b'; then
                ER_VERDICT="PARTIAL"
                echo "signal_a_trusted_er_verdict=PARTIAL author=${c_login} head_sha=${c_head_sha}"
                break
              elif echo "${c_body}" | grep -qiE '/er[[:space:]]+INCONCLUSIVE\b'; then
                ER_VERDICT="INCONCLUSIVE"
                echo "signal_a_trusted_er_verdict=INCONCLUSIVE author=${c_login} head_sha=${c_head_sha}"
                break
              fi
              echo "skip_comment author=${c_login} reason=trusted_no_verdict_token"
            done
          fi

          echo "signal_a_er_verdict=${ER_VERDICT:-ABSENT}"

          # --- Signal B: canonical evidence marker in PR body (hardened, issue #433) ---
          pr_body="$(gh api \
            -H "Accept: application/vnd.github+json" \
            "/repos/${REPO}/pulls/${PR_NUMBER}" \
            --jq '.body // ""')" || pr_body=""

          marker_line="$(echo "$pr_body" | grep -E '^\*\*Evidence\*\*:[[:space:]]+' | head -1 || true)"

          if [ -n "$marker_line" ]; then
            gist_url="$(echo "$marker_line" | grep -oE 'https://gist\.github\.com/[A-Za-z0-9_-]+/[A-Za-z0-9]+' | head -1 || true)"
            marker_sha="$(echo "$marker_line" | grep -oE 'head[[:space:]]+[0-9a-f]{7,64}' | awk '{print $2}' | head -1 || true)"

            if [ -n "$gist_url" ]; then
              # Verify gist is reachable and non-empty.
              #
              # Note on auth: the default `GITHUB_TOKEN` has read access
              # to issues/PRs but NOT to public gists (403 "Resource not
              # accessible by integration"). Public gists are fetchable
              # anonymously, so we use `curl` directly with no auth —
              # this is the canonical pattern for fetching public GitHub
              # resources from CI without elevating the token's scope.
              #
              # `gh api /gists/<id>` requires JUST the gist id (no user
              # prefix). A URL like `https://gist.github.com/<user>/<id>`
              # must be reduced to just `<id>` via `basename`.
              gist_id="$(basename "$gist_url")"
              gist_body="$(curl -fsSL \
                -H "Accept: application/vnd.github+json" \
                "https://api.github.com/gists/${gist_id}" 2>/dev/null)" || gist_body=""

              if [ -n "$gist_body" ] && [ "$gist_body" != "null" ]; then
                # Count files with non-empty content (issue #424).
                files_with_content="$(echo "$gist_body" | \
                  jq "[.files // {} | to_entries[] | select(.value.content != null and (.value.content | length > 0))] | length" \
                  2>/dev/null || echo "0")"

                # Aggregate total content size across all gist files
                # (issue #433 content floor). A placeholder 1-byte gist
                # fails this check.
                gist_content_size="$(echo "$gist_body" | \
                  jq "[.files // {} | to_entries[].value.content // \"\" | length] | add // 0" \
                  2>/dev/null || echo "0")"

                # Concatenate all file contents for the mention check.
                gist_content_all="$(echo "$gist_body" | \
                  jq -r '[.files // {} | to_entries[].value.content // ""] | join("\n")' \
                  2>/dev/null || echo "")"

                # Mention check (issue #433): the gist must reference
                # this PR (by PR_NUMBER) or this repo (by REPO). A
                # placeholder gist with neither fails.
                pr_mention=0
                repo_mention=0
                if echo "${gist_content_all}" | grep -qF "${PR_NUMBER}"; then
                  pr_mention=1
                fi
                if echo "${gist_content_all}" | grep -qF "${REPO}"; then
                  repo_mention=1
                fi

                # The full substantive-gist check (issue #433):
                #   files_with_content > 0 (issue #424 structural floor)
                #   AND content_size >= MIN_GIST_SIZE (issue #433 size floor)
                #   AND (mentions PR_NUMBER OR mentions REPO).
                if [ "${files_with_content:-0}" -gt 0 ] \
                   && [ "${gist_content_size:-0}" -ge "${MIN_GIST_SIZE}" ] \
                   && { [ "${pr_mention}" -eq 1 ] || [ "${repo_mention}" -eq 1 ]; }; then
                  MARKER_VERDICT="PASS"
                  echo "signal_b_marker=PASS gist=${gist_url} files_with_content=${files_with_content} content_size=${gist_content_size} min_size=${MIN_GIST_SIZE} pr_mention=${pr_mention} repo_mention=${repo_mention} marker_declared_sha=${marker_sha:-<none>}"
                else
                  echo "signal_b_marker=INSUFFICIENT gist=${gist_url} files_with_content=${files_with_content} content_size=${gist_content_size} min_size=${MIN_GIST_SIZE} pr_mention=${pr_mention} repo_mention=${repo_mention}"
                fi
              else
                echo "signal_b_marker=UNREACHABLE gist=${gist_url}"
              fi
            else
              echo "signal_b_marker=MALFORMED could not parse gist_url from: ${marker_line}"
            fi
          else
            echo "signal_b_marker=ABSENT (no **Evidence**: line in PR body)"
          fi

          # Combine signals: PASS if either signal passes; FAIL if either
          # signal fails; ABSENT only if both signals are absent.
          # A FAIL signal (e.g. /er FAIL) takes precedence over a PASS
          # signal — failure overrides success.
          if [ "$ER_VERDICT" = "FAIL" ] || [ "$ER_VERDICT" = "PARTIAL" ] || [ "$ER_VERDICT" = "INCONCLUSIVE" ]; then
            FINAL="FAIL"
            REASON="/er verdict is ${ER_VERDICT}"
          elif [ "$ER_VERDICT" = "PASS" ]; then
            FINAL="PASS"
            REASON="/er PASS comment on PR (trusted er_runner marker + head SHA match)"
          elif [ "$MARKER_VERDICT" = "PASS" ]; then
            FINAL="PASS"
            REASON="canonical evidence marker with substantive gist (size>=${MIN_GIST_SIZE} + PR/repo mention)"
          else
            FINAL="FAIL"
            REASON="no /er verdict (trusted+fresh) and no canonical evidence marker with substantive gist"
          fi

          echo "evidence_final_verdict=${FINAL}"
          echo "evidence_verdict_reason=${REASON}"
          echo "ER_VERDICT=${FINAL}" >> "$GITHUB_ENV"
          echo "ER_REASON=${REASON}" >> "$GITHUB_ENV"

      - name: Mark evidence-gate verdict (fail-closed)
        # Issue #424 + #433: the verdict is BOUND to independent ground
        # truth (an /er comment from the trusted er_runner OR a canonical
        # evidence marker with substantive gist), not echoed from this
        # template. The gate fails closed in four cases:
        #   1. No /er comment AND no canonical evidence marker.
        #   2. /er FAIL, /er PARTIAL, or /er INCONCLUSIVE comment.
        #   3. /er PASS without the er_runner allowlist marker
        #      (issue #433 identity binding).
        #   4. /er PASS referencing an OLDER head SHA, or canonical
        #      evidence marker with placeholder/empty gist, or
        #      canonical evidence marker with gist content that does
        #      not mention PR number or repo (issue #433).
        if: github.event_name == 'pull_request'
        run: |
          echo "Evidence verdict: ${ER_VERDICT:-ABSENT}"
          echo "Reason: ${ER_REASON:-no verdict signal found}"
          case "${ER_VERDICT:-ABSENT}" in
            PASS)
              echo "evidence_gate=PASS"
              echo "Verdict: PASS — ${ER_REASON}."
              exit 0
              ;;
            FAIL)
              echo "evidence_gate=FAIL"
              echo "Verdict: FAIL — ${ER_REASON}."
              exit 1
              ;;
            *)
              echo "evidence_gate=FAIL"
              echo "Verdict: FAIL — no /er verdict and no canonical evidence marker."
              echo "Either post /er PASS|FAIL|PARTIAL|INCONCLUSIVE as a PR comment"
              echo "(with the [dark-factory /er] marker + current head SHA), or include"
              echo "**Evidence**: <gist-url> in the PR body pointing at a public,"
              echo "non-empty gist whose content mentions this PR or repo."
              exit 1
              ;;
          esac