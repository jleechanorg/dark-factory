# Skeptic gate caller — invokes the SHA-bound gate on every pull_request.
#
# TRUST POSTURE:
#   This workflow is the bootstrap caller for the SHA-bound gate.
#   It must live on the default branch so PR-head edits cannot
#   forge the gate's verdict (the PR can edit its own caller copy,
#   but only the merge commit's caller survives, and the gate's
#   `trusted_code_sha` rejects any drift).
#
#   The gate workflow (`.github/workflows/skeptic-gate.yml`) is
#   called via `uses: jleechanorg/dark-factory/.github/workflows/skeptic-gate.yml@<SHA>`
#   where <SHA> is THIS workflow's commit SHA on the default
#   branch. This pins the gate's behavior to the immutable
#   trusted-code-ref invariant the gate enforces (see gate YAML
#   lines 244-275).
#
# TRIGGER POSTURE:
#   pull_request_target — required for same-repo API access to
#                         post bot comments and commit statuses
#                         (pull_request cannot post status events
#                         from a fork; pull_request_target can but
#                         only checkout trusted refs, never PR head).
#   workflow_dispatch   — operator manual re-runs on a given PR.
#
# WHY pull_request_target IS SAFE HERE:
#   The caller itself never executes PR-head code. The caller
#   job is a reusable-workflow invocation only; its `uses:` is a
#   static literal pinned to the caller's own commit SHA on the
#   default branch, NOT the moving default branch and NOT the PR
#   head. The job-level `uses:` is required because GitHub Actions
#   does not allow reusable-workflow invocations inside a step, and
#   the ref must be a static literal (no expressions).
#
#   The resolved SHA is forwarded to the gate via
#   `trusted_code_sha`. The gate then sparse-checkouts ONLY its
#   own Python files at that pinned SHA and refuses to run if
#   `git rev-parse HEAD` does not equal the input. PR-head
#   Python is NEVER executed.
#
# See docs/skeptic-gate.md and the E6 swarm synthesis at
# docs/plans/swarm-pr281-skeptic-gate/10-synthesis-final.md
# (C-F3: this caller is the missing automation-completeness link).

name: skeptic-gate-caller

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to (re-)run skeptic on"
        required: true
        type: string
      pr_sha:
        description: "Optional PR head SHA override"
        required: false
        type: string
        default: ""
      bead_id:
        description: "Optional bead id (issue #386 r3). When set, the gate loads the contract from `br show --json <id>` instead of running the legacy 10-field contract."
        required: false
        type: string
        default: ""
      contract_file:
        description: "Optional path to a hand-authored bead-contract JSON (issue #386). Falls back when bead_id is not set."
        required: false
        type: string
        default: ""

permissions:
  contents: read
  pull-requests: read
  statuses: read

jobs:
  config-check:
    name: Skeptic config check
    # UNCONFIGURED-GUARD (bead rev-iqa9, post-audit comment 4953116428):
    # Fleet forensics proved the reviewer CLIs (codex/gemini) are absent
    # from ALL runner containers as of this fix. pull_request_target has
    # no `paths:` filter, so it fires for every PR event. Invoking the
    # gate unconditionally in that state would put a RED "Skeptic" check
    # on every future PR purely because the environment isn't
    # provisioned yet -- strictly worse repo hygiene than the pre-fix
    # zero-job failure this branch already resolved.
    #
    # This job ALWAYS runs and ALWAYS succeeds. It only decides whether
    # the real gate job below is worth invoking. When pins are missing
    # it emits a loud ::warning:: + step-summary and the downstream
    # `skeptic` job is SKIPPED -- callers see a green config-check and a
    # skipped gate, never a red one.
    #
    # This is a SEPARATE invariant from the gate's own "Verify mandatory
    # pin vars" fail-closed step in skeptic-gate.yml, which is NOT
    # touched by this change: that step still hard-fails with no
    # defaulting whenever the gate actually runs (configured=true, or an
    # explicit human workflow_dispatch below). This job only prevents
    # the gate from being invoked at all in the unconfigured case; it
    # never softens or bypasses the fail-closed check inside the gate.
    runs-on: ${{ fromJson(vars.SELF_HOSTED_RUNNER_LABELS) }}
    outputs:
      configured: ${{ steps.check.outputs.configured }}
    env:
      SKEPTIC_CODEX_BIN: ${{ vars.SKEPTIC_CODEX_BIN }}
      SKEPTIC_CODEX_VERSION: ${{ vars.SKEPTIC_CODEX_VERSION }}
      SKEPTIC_CODEX_SHA256: ${{ vars.SKEPTIC_CODEX_SHA256 }}
      SKEPTIC_GEMINI_BIN: ${{ vars.SKEPTIC_GEMINI_BIN }}
      SKEPTIC_GEMINI_VERSION: ${{ vars.SKEPTIC_GEMINI_VERSION }}
      SKEPTIC_GEMINI_SHA256: ${{ vars.SKEPTIC_GEMINI_SHA256 }}
    steps:
      - name: Evaluate reviewer CLI pin vars
        id: check
        run: |
          set -euo pipefail
          names=(SKEPTIC_CODEX_BIN SKEPTIC_CODEX_VERSION SKEPTIC_CODEX_SHA256 SKEPTIC_GEMINI_BIN SKEPTIC_GEMINI_VERSION SKEPTIC_GEMINI_SHA256)
          missing=()
          for name in "${names[@]}"; do
            val="${!name}"
            if [ -z "$val" ]; then
              missing+=("$name")
            fi
          done
          if [ "${#missing[@]}" -eq 0 ]; then
            echo "configured=true" >> "$GITHUB_OUTPUT"
            echo "[skeptic-config-check] OK: all 6 reviewer CLI pin vars set"
          else
            echo "configured=false" >> "$GITHUB_OUTPUT"
            missing_list="${missing[*]}"
            echo "::warning::Skeptic gate NOT CONFIGURED -- reviewer CLI pins unset ($missing_list); see dark-factory bead rev-iqa9 (fleet provisioning). Gate intentionally skipped, not run with defaults."
            {
              echo "## Skeptic gate -- NOT CONFIGURED"
              echo ""
              echo "Reviewer CLI pin vars unset: \`$missing_list\`"
              echo ""
              echo "The gate is intentionally **skipped** for this run rather than"
              echo "executed with defaults (no silent fallback -- post-audit comment"
              echo "4953116428). See bead **rev-iqa9** (fleet provisioning: reviewer"
              echo "CLIs absent from all runner containers) for the tracked follow-up."
            } >> "$GITHUB_STEP_SUMMARY"
          fi

  skeptic:
    name: Skeptic gate (mandatory, SHA-bound)
    needs: [config-check]
    # Run the real gate only when configured, OR when a human explicitly
    # dispatches it manually -- workflow_dispatch always reaches the
    # gate's own fail-closed "Verify mandatory pin vars" step (see the
    # config-check comment above; bead rev-iqa9).
    if: needs.config-check.outputs.configured == 'true' || github.event_name == 'workflow_dispatch'
    # IMPLICIT PIN: this `uses:` ref is a literal 40-hex SHA — the
    # caller's commit SHA on the default branch at the time this
    # caller was made mandatory (bead jleechan-5n0o). GitHub Actions
    # does NOT evaluate `${{ }}` inside a `uses:` ref, so the SHA must
    # be a static literal. The runtime binding that the gate verifies
    # against is forwarded via `with.trusted_code_sha`, which IS
    # expression-evaluated and resolves to the same caller SHA.
    #
    # Trust posture (see skeptic-gate.md "Trust posture"):
    #   - pull_request_target grants same-target-repo bot API access
    #     so the gate can post comments + the `skeptic` commit status.
    #   - The reusable-workflow call is required (not just a step)
    #     because GitHub does not allow workflow_call inside a step.
    #   - The gate's own "Validate trusted_code_sha" + "Verify
    #     checked-out HEAD" steps defend against drift — even if the
    #     SHA above is later rebased, the gate fails closed when the
    #     checked-out HEAD disagrees with the input.
    uses: jleechanorg/dark-factory/.github/workflows/skeptic-gate.yml@4c2d23d71fe3d0a063792bb27e99c3489f43cbc1
    with:
      pr_number: ${{ github.event.pull_request.number }}
      pr_sha: ${{ github.event.pull_request.head.sha }}
      # `github.sha` on a pull_request_target run resolves to the
      # CALLER's commit SHA on the default branch — exactly the SHA
      # pinned in the `uses:` ref above. The gate uses this to verify
      # its own checkout (skeptic-gate.yml lines 297-311).
      trusted_code_sha: ${{ github.sha }}
      bead_id: ${{ inputs.bead_id }}
      contract_file: ${{ inputs.contract_file }}
    secrets:
      gate_github_token: ${{ secrets.GITHUB_TOKEN }}
