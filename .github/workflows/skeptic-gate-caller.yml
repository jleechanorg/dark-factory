# Skeptic gate caller — invokes the SHA-bound gate on every pull_request.
#
# TRUST POSTURE:
#   This workflow is the bootstrap caller for the SHA-bound gate.
#   It must live on the default branch so PR-head edits cannot
#   forge the gate's verdict (the PR can edit its own caller copy,
#   but only the merge commit's caller survives, and the gate's
#   `trusted_code_sha` rejects any drift).
#
#   The gate workflow (`.github/workflows/skeptic-gate.yml`) is
#   called via `uses: jleechanorg/dark-factory/.github/workflows/skeptic-gate.yml@<SHA>`
#   where <SHA> is THIS workflow's commit SHA on the default
#   branch. This pins the gate's behavior to the immutable
#   trusted-code-ref invariant the gate enforces (see gate YAML
#   lines 244-275).
#
# TRIGGER POSTURE:
#   pull_request_target — required for same-repo API access to
#                         post bot comments and commit statuses
#                         (pull_request cannot post status events
#                         from a fork; pull_request_target can but
#                         only checkout trusted refs, never PR head).
#   workflow_dispatch   — operator manual re-runs on a given PR.
#
# WHY pull_request_target IS SAFE HERE:
#   The caller itself never executes PR-head code. The caller
#   job is a reusable-workflow invocation only; its `uses:` is a
#   static literal pinned to the caller's own commit SHA on the
#   default branch, NOT the moving default branch and NOT the PR
#   head. The job-level `uses:` is required because GitHub Actions
#   does not allow reusable-workflow invocations inside a step, and
#   the ref must be a static literal (no expressions).
#
#   The resolved SHA is forwarded to the gate via
#   `trusted_code_sha`. The gate then sparse-checkouts ONLY its
#   own Python files at that pinned SHA and refuses to run if
#   `git rev-parse HEAD` does not equal the input. PR-head
#   Python is NEVER executed.
#
# See docs/skeptic-gate.md and the E6 swarm synthesis at
# docs/plans/swarm-pr281-skeptic-gate/10-synthesis-final.md
# (C-F3: this caller is the missing automation-completeness link).

name: skeptic-gate-caller

on:
  pull_request_target:
    types: [opened, synchronize, reopened, edited]
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to (re-)run skeptic on"
        required: true
        type: string
      pr_sha:
        description: "Optional PR head SHA override"
        required: false
        type: string
        default: ""
      bead_id:
        description: "Optional bead id (issue #386 r3). When set, the gate loads the contract from `br show --json <id>` instead of running the legacy 10-field contract."
        required: false
        type: string
        default: ""
      contract_file:
        description: "Optional path to a hand-authored bead-contract JSON (issue #386). Falls back when bead_id is not set."
        required: false
        type: string
        default: ""

# Per-PR concurrency so a new push cancels an in-flight run on
# the old head (matches the gate's own per-SHA concurrency).
concurrency:
  group: skeptic-caller-pr-${{ github.event.pull_request.number || inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  resolve-caller-sha:
    name: Resolve caller SHA (immutable ref to pin the gate to)
    runs-on: ubuntu-latest
    timeout-minutes: 2
    outputs:
      caller_sha: ${{ steps.resolve.outputs.caller_sha }}
    steps:
      - name: Resolve caller SHA on the default branch
        # We resolve the commit SHA of the caller workflow file on
        # the default branch — NOT the file blob SHA (which is what
        # /contents returns), and NOT the PR head (which is
        # untrusted). The commit SHA lets the gate `actions/checkout`
        # at `ref: <commit_sha>` and pull the gate's Python files
        # at the exact trusted revision.
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          caller_sha=$(gh api \
            "repos/$GITHUB_REPOSITORY/commits?path=.github/workflows/skeptic-gate-caller.yml&sha=main&per_page=1" \
            --jq '.[0].sha')
          if ! echo "$caller_sha" | grep -qE '^[0-9a-f]{40}$'; then
            echo "[skeptic-caller] FATAL: resolved caller SHA is not 40-hex: $caller_sha"
            exit 1
          fi
          echo "caller_sha=$caller_sha" >> "$GITHUB_OUTPUT"
          echo "[skeptic-caller] resolved caller SHA=$caller_sha (gate will be pinned to this ref)"

  call-skeptic-gate:
    name: Call SHA-bound skeptic gate
    needs: resolve-caller-sha
    # Reusable-workflow invocation MUST live at the job level; the
    # `uses:` ref MUST be a static literal (no expressions). We
    # pin to this caller's own commit SHA on the default branch.
    uses: jleechanorg/dark-factory/.github/workflows/skeptic-gate.yml@4e23f30266ee63d51b194b5a8a02eea0d38b7a7a
    with:
      pr_number: ${{ github.event.pull_request.number || inputs.pr_number }}
      pr_sha: ${{ github.event.pull_request.head.sha || inputs.pr_sha }}
      # Forward the server-resolved SHA so the gate can refuse to
      # run if its checkout disagrees. For workflow_dispatch the
      # gate derives trusted_code_sha from the workflow ref itself,
      # so we pass an empty string and the gate's server-side
      # resolution takes over (see gate workflow line 230-246).
      trusted_code_sha: ${{ needs.resolve-caller-sha.outputs.caller_sha || '' }}
      # r3 (issue #386): forward contract source. Pull from PR
      # body `bead:` label (preferred — auto-detected per PR) or
      # fall back to dispatch inputs.
      bead_id: ${{ inputs.bead_id }}
      contract_file: ${{ inputs.contract_file }}
    secrets:
      github_token: ${{ secrets.GITHUB_TOKEN }}
