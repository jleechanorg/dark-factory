name: CI

# Stub-mode policy: DARK_FACTORY_CI_ALLOW_STUB=1 is intentionally NOT set
# globally. The default real-mode jobs (test, daemon-tests) must run without
# stub-mode so a regression that accidentally enables stub-mode cannot ship
# as a green CI. The dedicated `stub-gate-smoke` job below proves the
# env_guard::stub_mode_allowed() two-key gate fires correctly in CI; only
# future iteration-ceiling reproducer jobs that genuinely need stub-mode
# behaviour should set `DARK_FACTORY_CI_ALLOW_STUB=1`. See PR #498 (daemon
# gate) and PR #499 (controller gate) for the full contract.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DISABLE_SANDBOX: "1"
      DARK_FACTORY_HOLDOUTS: "${{ github.workspace }}/tests/fixtures/holdout-eval"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55  # v5.5.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run bash integration tests
        # The tests/scripts/*.sh suite exercises factory-overlay.sh, factory-af-tick.sh,
        # and the callpath overlay-harness probe. Without this step, regressions in
        # those scripts only surface when an operator runs them locally.
        # See bead jleechan-50jf.
        run: |
          set +e
          fail=0
          for t in tests/scripts/test_*.sh; do
            echo "::group::$t"
            bash "$t" || { echo "::error file=$t::test failed"; fail=$((fail + 1)); }
            echo "::endgroup::"
          done
          exit $fail

      - name: Graph structural audit (G1/G2 dogfooding)
        run: python -m runner.graph_audit pipelines

  daemon-tests:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure main ref for VCS integration test
        # daemon/tests/adapters_integration.rs:7 calls `git base_head main` which
        # requires a local `main` ref. actions/checkout by default does NOT create
        # a local `main` ref (only the PR ref + origin/main). This explicit fetch
        # populates the local `main` ref so the Rust test passes.
        # See bead jleechan-q2wu.
        run: |
          git fetch origin main
          git show-ref --verify --quiet refs/heads/main || git branch main origin/main

      - name: cargo test (daemon crate)
        working-directory: daemon
        run: cargo test --verbose

      - name: cargo clippy (deny warnings)
        working-directory: daemon
        run: cargo clippy -- -D warnings

  stub-gate-smoke:
    # Proves the env_guard::stub_mode_allowed() two-key gate fires correctly
    # in CI (GITHUB_ACTIONS=true is auto-set by GitHub Actions). This is the
    # only job that opts in to stub-mode. Default jobs above MUST NOT set
    # DARK_FACTORY_CI_ALLOW_STUB so a regression cannot accidentally enable
    # stub-mode for the full test suite.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DARK_FACTORY_CI_ALLOW_STUB: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: cargo test env_guard (CI gate fires when both keys present)
        working-directory: daemon
        run: cargo test --lib env_guard::tests::ci_with_both_env_vars_returns_true

      - name: cargo test env_guard (CI gate rejects partial keys)
        # Defensive: with DARK_FACTORY_CI_ALLOW_STUB but no GITHUB_ACTIONS, the
        # gate must still reject. We simulate the absence of GITHUB_ACTIONS by
        # unsetting it for this step.
        working-directory: daemon
        env:
          GITHUB_ACTIONS:
        run: |
          unset GITHUB_ACTIONS
          cargo test --lib \
            env_guard::tests::only_github_actions_is_not_enough \
            env_guard::tests::only_allow_stub_is_not_enough

  stub-gate-smoke:
    # Proves the env_guard::stub_mode_allowed() two-key gate fires correctly
    # in CI (GITHUB_ACTIONS=true is auto-set by GitHub Actions). This is the
    # only job that opts in to stub-mode. Default jobs above MUST NOT set
    # DARK_FACTORY_CI_ALLOW_STUB so a regression cannot accidentally enable
    # stub-mode for the full test suite.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DARK_FACTORY_CI_ALLOW_STUB: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: cargo test env_guard (CI gate fires when both keys present)
        working-directory: daemon
        run: cargo test --lib env_guard::tests::ci_with_both_env_vars_returns_true

      - name: cargo test env_guard (CI gate rejects partial keys)
        # Defensive: with DARK_FACTORY_CI_ALLOW_STUB but no GITHUB_ACTIONS, the
        # gate must still reject. We simulate the absence of GITHUB_ACTIONS by
        # unsetting it for this step.
        working-directory: daemon
        env:
          GITHUB_ACTIONS:
        run: |
          unset GITHUB_ACTIONS
          cargo test --lib \
            env_guard::tests::only_github_actions_is_not_enough \
            env_guard::tests::only_allow_stub_is_not_enough

  stub-gate-smoke:
    # Proves the env_guard::stub_mode_allowed() two-key gate fires correctly
    # in CI (GITHUB_ACTIONS=true is auto-set by GitHub Actions). This is the
    # only job that opts in to stub-mode. Default jobs above MUST NOT set
    # DARK_FACTORY_CI_ALLOW_STUB so a regression cannot accidentally enable
    # stub-mode for the full test suite.
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DARK_FACTORY_CI_ALLOW_STUB: "1"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: cargo test env_guard (CI gate fires when both keys present)
        working-directory: daemon
        run: cargo test --lib env_guard::tests::ci_with_both_env_vars_returns_true

      - name: cargo test env_guard (CI gate rejects partial keys)
        # Defensive: with DARK_FACTORY_CI_ALLOW_STUB but no GITHUB_ACTIONS, the
        # gate must still reject. We simulate the absence of GITHUB_ACTIONS by
        # unsetting it for this step.
        working-directory: daemon
        env:
          GITHUB_ACTIONS:
        run: |
          unset GITHUB_ACTIONS
          cargo test --lib \
            env_guard::tests::only_github_actions_is_not_enough \
            env_guard::tests::only_allow_stub_is_not_enough