name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ${{ fromJson(vars.SELF_HOSTED_RUNNER_LABELS) }}
    permissions:
      contents: read
    env:
      DISABLE_SANDBOX: "1"
      DARK_FACTORY_HOLDOUTS: "${{ github.workspace }}/tests/fixtures/holdout-eval"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Create venv and install dependencies
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r requirements.txt pytest
          echo "${{ github.workspace }}/.venv/bin" >> "$GITHUB_PATH"
          echo "VIRTUAL_ENV=${{ github.workspace }}/.venv" >> "$GITHUB_ENV"

      - name: Provision sqlite3 CLI
        # Download pinned, architecture-aware sqlite3 CLI from sqlite.org.
        # Checksum-verified (SHA3-256), user-scope (no sudo), placed on PATH
        # before the bash integration test suite.  See bead jleechan-432s.
        # Linux-aarch64 has no upstream sqlite-tools binary; fall back to
        # the system package manager in that case.
        run: |
          if command -v sqlite3 >/dev/null 2>&1 && sqlite3 ':memory:' 'SELECT 1;' >/dev/null 2>&1; then
            echo "sqlite3 $(sqlite3 --version) already on PATH"
            exit 0
          fi
          OS="$(uname -s)"
          ARCH="$(uname -m)"
          VER="3530300"
          YEAR="2026"
          case "${OS}-${ARCH}" in
            Darwin-arm64)
              URL="https://sqlite.org/${YEAR}/sqlite-tools-osx-arm64-${VER}.zip"
              SHA3="b340969cf0e23a4c82c20319032c40cbc39264cb27b9cf71bf51875c24db4204"
              ;;
            Darwin-x86_64)
              URL="https://sqlite.org/${YEAR}/sqlite-tools-osx-x64-${VER}.zip"
              SHA3="84e04e0d57da6d4bfd2cd9aca97a5737e5da14c7a2576850638c48b946f37d12"
              ;;
            Linux-x86_64)
              URL="https://sqlite.org/${YEAR}/sqlite-tools-linux-x64-${VER}.zip"
              SHA3="83b43a9ef8b56f74ece1813161816133045ca834444bfa6bb34c6166328474f8"
              ;;
            Linux-aarch64)
              # No upstream sqlite-tools binary for Linux arm64.  Several
              # bash integration tests (factory-overlay.sh, rollback) shell
              # out to `sqlite3` directly and require a working binary.
              # Self-hosted runners run with no-new-privileges, so sudo is
              # blocked and apt-get install fails. Build from the official
              # amalgamation (~5MB sqlite3.c + shell.c) using gcc into
              # $HOME/.local/bin and export on PATH.
              if command -v sqlite3 >/dev/null 2>&1 && sqlite3 ':memory:' 'SELECT 1;' >/dev/null 2>&1; then
                echo "sqlite3 $(sqlite3 --version) found on PATH (no provision needed)"
                exit 0
              fi
              SQLITE_VER="3530300"
              SQLITE_YEAR="2026"
              AMALG_URL="https://sqlite.org/${SQLITE_YEAR}/sqlite-amalgamation-${SQLITE_VER}.zip"
              BIN_DIR="${HOME}/.local/bin"
              mkdir -p "${BIN_DIR}"
              TMP_DIR="$(mktemp -d)"
              echo "::notice::Building sqlite3 from amalgamation for Linux-aarch64"
              if ! command -v gcc >/dev/null 2>&1; then
                echo "::error::gcc missing on Linux-aarch64 runner; cannot build sqlite3 from amalgamation"
                rm -rf "${TMP_DIR}"
                exit 1
              fi
              curl -fsSL -o "${TMP_DIR}/amalg.zip" "${AMALG_URL}"
              unzip -qo "${TMP_DIR}/amalg.zip" -d "${TMP_DIR}/amalg"
              SRC_DIR="$(find "${TMP_DIR}/amalg" -maxdepth 2 -type d -name 'sqlite-amalgamation-*' | head -1)"
              if [ -z "${SRC_DIR}" ]; then
                echo "::error::Could not locate sqlite-amalgamation source directory in ${TMP_DIR}/amalg"
                rm -rf "${TMP_DIR}"
                exit 1
              fi
              gcc -O2 -o "${BIN_DIR}/sqlite3" \
                "${SRC_DIR}/shell.c" \
                "${SRC_DIR}/sqlite3.c" \
                -lpthread -ldl -lm
              "${BIN_DIR}/sqlite3" ':memory:' 'SELECT 1;' >/dev/null 2>&1 || {
                echo "::error::Built sqlite3 binary failed sanity check"
                rm -rf "${TMP_DIR}"
                exit 1
              }
              echo "::notice::sqlite3 $(${BIN_DIR}/sqlite3 --version) built from amalgamation"
              rm -rf "${TMP_DIR}"
              echo "${BIN_DIR}" >> "${GITHUB_PATH}"
              export PATH="${BIN_DIR}:${PATH}"
              exit 0
              ;;
            *)
              echo "::error::Unsupported platform: ${OS}-${ARCH}"; exit 1
              ;;
          esac
          TOOLS_DIR="${RUNNER_TEMP}/sqlite-tools"
          mkdir -p "${TOOLS_DIR}"
          curl -fsSL -o "${TOOLS_DIR}/sqlite.zip" "${URL}"
          ACTUAL="$(openssl dgst -sha3-256 "${TOOLS_DIR}/sqlite.zip" | awk '{print $NF}')"
          if [ "${ACTUAL}" != "${SHA3}" ]; then
            echo "::error::SHA3-256 mismatch! Expected ${SHA3}, got ${ACTUAL}"
            exit 1
          fi
          unzip -qo "${TOOLS_DIR}/sqlite.zip" -d "${TOOLS_DIR}"
          case "${OS}" in
            Darwin)
              xattr -d com.apple.quarantine "${TOOLS_DIR}"/sqlite-tools-*/sqlite3 2>/dev/null || true
              ;;
          esac
          BIN_DIR="$(dirname "$(find "${TOOLS_DIR}" -name sqlite3 -type f | head -1)")"
          echo "${BIN_DIR}" >> "${GITHUB_PATH}"
          export PATH="${BIN_DIR}:${PATH}"
          sqlite3 --version

      - name: Run tests
        run: .venv/bin/python -m pytest tests/ -v --tb=short

      - name: Run bash integration tests
        # The tests/scripts/*.sh suite exercises factory-overlay.sh, factory-af-tick.sh,
        # and the callpath overlay-harness probe. Without this step, regressions in
        # those scripts only surface when an operator runs them locally.
        # test_factory_overlay.sh falls back to `cargo build` if the daemon
        # binary is missing, so the toolchain must be present in this job.
        # See bead jleechan-50jf and jleechan-u2es.
        run: |
          set +e
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            source "$HOME/.cargo/env"
          fi
          rustup show
          cargo --version
          rustc --version
          cargo build --quiet --manifest-path daemon/Cargo.toml
          fail=0
          for t in tests/scripts/test_*.sh; do
            echo "::group::$t"
            bash "$t" || { echo "::error file=$t::test failed"; fail=$((fail + 1)); }
            echo "::endgroup::"
          done
          exit $fail

      - name: Graph structural audit (G1/G2 dogfooding)
        run: .venv/bin/python -m runner.graph_audit pipelines

  daemon-tests:
    runs-on: ${{ fromJson(vars.SELF_HOSTED_RUNNER_LABELS) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure main ref for VCS integration test
        # daemon/tests/adapters_integration.rs:7 calls `git base_head main` which
        # requires a local `main` ref. actions/checkout by default does NOT create
        # a local `main` ref (only the PR ref + origin/main). This explicit fetch
        # populates the local `main` ref so the Rust test passes.
        # See bead jleechan-q2wu.
        run: |
          git fetch origin main
          git show-ref --verify --quiet refs/heads/main || git branch main origin/main

      - name: Set up Rust toolchain (pinned user-scope)
        # Self-hosted runners may not have cargo/rustup pre-installed.
        # Install rustup with stable toolchain user-scope (no sudo).
        # GITHUB_PATH only affects subsequent steps; export PATH immediately
        # so rustup/cargo/rustc are visible within this same step.
        # See bead jleechan-u2es.
        run: |
          if ! command -v rustup >/dev/null 2>&1; then
            curl --proto '=https' --tlsv1.2 -sSf https://sh.rustup.rs | sh -s -- -y --default-toolchain stable
            echo "$HOME/.cargo/bin" >> "$GITHUB_PATH"
            source "$HOME/.cargo/env"
          fi
          rustup show
          cargo --version
          rustc --version

      - name: Provision Node 22.22.0 (for AO bridge tests)
        # bridge_test_node() in adapters.rs looks for
        # ~/.nvm/versions/node/v22.22.0/bin/node. Self-hosted runners don't
        # ship nvm, so install via NodeSource tarball into the same path.
        # Must run BEFORE cargo test because ao_spawn_contract_tests invoke
        # node through bridge_test_node() during the cargo test step.
        # See global CLAUDE.md "Use nvm Node 22 (v22.22.0)".
        run: |
          NODE_BIN="${HOME}/.nvm/versions/node/v22.22.0/bin"
          if [ -x "${NODE_BIN}/node" ]; then
            "${NODE_BIN}/node" --version
            exit 0
          fi
          OS="$(uname -s)"
          ARCH="$(uname -m)"
          case "${OS}-${ARCH}" in
            Darwin-x86_64) NODE_ARCH=darwin-x64 ;;
            Darwin-arm64)  NODE_ARCH=darwin-arm64 ;;
            Linux-x86_64)  NODE_ARCH=linux-x64 ;;
            Linux-aarch64) NODE_ARCH=linux-arm64 ;;
            *) echo "::error::Unsupported Node arch: ${OS}-${ARCH}"; exit 1 ;;
          esac
          mkdir -p "${NODE_BIN%/*}"
          curl -fsSL -o /tmp/node.tar.xz "https://nodejs.org/dist/v22.22.0/node-v22.22.0-${NODE_ARCH}.tar.xz"
          tar -xJf /tmp/node.tar.xz -C /tmp
          cp -r "/tmp/node-v22.22.0-${NODE_ARCH}/bin" "/tmp/node-v22.22.0-${NODE_ARCH}/lib" "/tmp/node-v22.22.0-${NODE_ARCH}/include" "/tmp/node-v22.22.0-${NODE_ARCH}/share" "${NODE_BIN%/*}/"
          "${NODE_BIN}/node" --version

      - name: cargo test (daemon crate)
        working-directory: daemon
        run: cargo test --verbose

      - name: cargo clippy (deny warnings)
        working-directory: daemon
        run: cargo clippy -- -D warnings
