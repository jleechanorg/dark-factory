name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# All jobs target the org's self-hosted runner pool via the
# SELF_HOSTED_RUNNER_LABELS repo variable. The variable is parsed from a JSON
# array string into a YAML label list using fromJSON(...). When the variable
# drifts to a selector that matches zero online runners, jobs queue forever —
# that is why runner-selector-drift.yml runs as a separate, hardcoded-selector
# cron + push gate to detect the drift before CI becomes invisible.
#
# Never set `runs-on: ubuntu-latest` here. GitHub-hosted runners are the
# explicit fallback we are forbidding under bead jleechan-z284 / issue #286.
# See docs/self-hosted-runner-selector.md.

jobs:
  test:
    # Fork-PR isolation: self-hosted runners are persistent and may carry
    # org secrets / cached build state. Untrusted fork PR code must not
    # execute on them — the risk is a persistent compromise of the runner
    # (see GitHub's secure-use docs for public repos with self-hosted runners).
    # Same guard as evidence-gate.yml: fork PRs are skipped, not silently
    # rerouted; the PR author must open from a branch in the same org.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ${{ fromJSON(vars.SELF_HOSTED_RUNNER_LABELS) }}
    permissions:
      contents: read
    env:
      DISABLE_SANDBOX: "1"
      DARK_FACTORY_HOLDOUTS: "${{ github.workspace }}/tests/fixtures/holdout-eval"
      # Pinned ripgrep 14.1.1 SHA256 manifest. The case statement in the
      # provisioning step maps (RUNNER_OS, RUNNER_ARCH) to (target triple,
      # sha256). Updating rg requires updating both. Verified via:
      #   curl -sL https://github.com/BurntSushi/ripgrep/releases/download/14.1.1/ripgrep-14.1.1-<triple>.tar.gz.sha256
      RG_VERSION: "14.1.1"
      RG_RELEASE_BASE: "https://github.com/BurntSushi/ripgrep/releases/download"
      RG_SHA_LINUX_X86_64: "4cf9f2741e6c465ffdb7c26f38056a59e2a2544b51f7cc128ef28337eeae4d8e"
      RG_SHA_LINUX_ARM64: "c827481c4ff4ea10c9dc7a4022c8de5db34a5737cb74484d62eb94a95841ab2f"
      RG_SHA_MACOS_X86_64: "fc87e78f7cb3fea12d69072e7ef3b21509754717b746368fd40d88963630e2b3"
      RG_SHA_MACOS_ARM64: "24ad76777745fbff131c8fbc466742b011f925bfa4fffa2ded6def23b5b937be"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          persist-credentials: false

      - name: Bootstrap-preflight (verify prereq tools before any use)
        # Every later step assumes `curl`, `sha256sum`, `tar`, `awk`, `bash`,
        # `git`, and `python3` exist on the runner. Verify BEFORE pip or rg
        # provisioning so a missing bootstrap tool fails the job with a
        # single ::error listing every missing binary — instead of a
        # confusing "rg binary not present after unpack" stack trace from
        # a missing curl.
        run: |
          set -euo pipefail
          missing=()
          for bin in bash sh curl sha256sum tar awk sed tr git python3; do
            if ! command -v "$bin" >/dev/null 2>&1; then
              missing+=("$bin")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Bootstrap preflight failed::missing=${missing[*]}"
            exit 1
          fi
          echo "OK: bootstrap preflight passed (bash=$(bash --version | head -1), curl=$(curl --version | head -1 | awk '{print $1 $2}'), git=$(git --version | awk '{print $3}'), python3=$(python3 --version | awk '{print $2}'))"

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55  # v5.5.0
        with:
          python-version: "3.13"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Provide sqlite3 CLI (build from amalgamation, no root)
        # `daemon/factory-overlay.sh:77` is `sql() { sqlite3 ... }` — the overlay
        # is the canonical executable spec for the factory state machine and every
        # subcommand shells out to the sqlite3 BINARY. Without it,
        # tests/scripts/*.sh fail with "line 77: sqlite3: command not found" and
        # read empty state (expected 'DISPATCHED', got '').
        #
        # THREE SIMPLER APPROACHES ARE RULED OUT — do not "simplify" this back:
        #  1. `sudo apt-get install sqlite3` — no sudo. The Linux runners are
        #     containers with the no-new-privileges flag: "sudo: The 'no new
        #     privileges' flag is set, which prevents sudo from running as root."
        #  2. A python-stdlib sqlite3 CLI shim — passed a toy self-test, then
        #     FAILED the real tests/scripts/test_factory_overlay.sh with a
        #     JSONDecodeError. The overlay depends on CLI behaviour a shim does
        #     not reproduce. Install a real binary; do not emulate one.
        #  3. `apt-get download` + `dpkg -x` — worked on a dev host, FAILED on CI:
        #     "apt-get download sqlite3 failed - no package lists or no network."
        #     The container has no apt lists.
        #
        # Building the amalgamation needs only a C compiler (present — this job's
        # sibling builds Rust) and one file fetch. Pinned + checksummed so the
        # build is reproducible and a tampered/rotated archive fails closed.
        # Bead jleechan-xn4n.
        run: |
          set -euo pipefail
          if command -v sqlite3 >/dev/null 2>&1; then
            echo "sqlite3 already present: $(sqlite3 --version)"
            exit 0
          fi
          if [ "$(uname -s)" != "Linux" ]; then
            echo "::error::sqlite3 missing on a non-Linux runner — unexpected; not building."
            exit 1
          fi
          ver=sqlite-amalgamation-3450100
          sha256=5592243caf28b2cdef41e6ab58d25d653dfc53deded8450eb66072c929f030c4
          work="$(mktemp -d)"
          curl -fsSL --retry 3 -o "$work/amalg.zip" "https://sqlite.org/2024/$ver.zip"
          echo "$sha256  $work/amalg.zip" | sha256sum -c - \
            || { echo "::error::sqlite amalgamation checksum mismatch — refusing to build."; exit 1; }
          unzip -q "$work/amalg.zip" -d "$work"
          ( cd "$work/$ver" && cc -O1 -DSQLITE_THREADSAFE=0 \
              -DSQLITE_OMIT_LOAD_EXTENSION shell.c sqlite3.c -o sqlite3 -lm )
          mkdir -p "$HOME/.local/bin"
          cp "$work/$ver/sqlite3" "$HOME/.local/bin/sqlite3"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
          export PATH="$HOME/.local/bin:$PATH"
          sqlite3 --version
          # Fail here, not deep inside the overlay suite, if the binary is broken.
          t="$(mktemp -d)"
          sqlite3 "$t/p.db" "CREATE TABLE t(a TEXT);" "INSERT INTO t VALUES('ok');"
          [ "$(sqlite3 -cmd '.timeout 5000' "$t/p.db" 'SELECT a FROM t;')" = "ok" ] \
            || { echo "::error::built sqlite3 failed its self-test"; exit 1; }
          echo "sqlite3 built from amalgamation and self-tested"

      - name: Fix Python 3.13 shared-library path (self-hosted runners)
        # actions/setup-python installs Python 3.13 under a toolcache path
        # (`/home/runner/_work/_tool/Python/<ver>/<arch>/`) and ships
        # `libpython3.13.so` WITHOUT the versioned soname symlink
        # (`libpython3.13.so.1.0`). The dynamic linker resolves the soname, not
        # the link-time name, so any subprocess `python3` invocation fails with
        # `error while loading shared libraries: libpython3.13.so.1.0` and
        # rc=127, taking test_preflight.py / test_structural_preflight.py /
        # test_conformance.py etc. down with it.
        #
        # CRITICAL: this step MUST NOT call `python3` for self-discovery
        # because when the soname symlink is absent, `python3` itself fails
        # to load and `python3 -c 'import sys; print(sys.prefix)'` returns
        # 127 BEFORE the remediation runs. Instead, derive the toolchain dir
        # from `PythonLocation` (exported by actions/setup-python), fall back
        # to the symlink-resolved `command -v python3`, and explicitly verify
        # rc=0 on a subprocess `python3 -c 'pass'` invocation BEFORE the test
        # step runs.
        run: |
          set -u
          if [ "$(uname -s)" != "Linux" ]; then
            echo "Not Linux ($(uname -s)) — skipping Linux libpython3.13.so soname fix."
            exit 0
          fi
          # 1) Resolve the toolchain ROOT directory WITHOUT invoking python3.
          # `pythonLocation` (set by actions/setup-python v5) points at the
          # toolchain ROOT (e.g. /home/runner/_work/_tool/Python/3.13.14/arm64),
          # not the bin subdir; the binary lives at `$TOOLCHAIN_ROOT/bin/python3`.
          TOOLCHAIN_ROOT="${PythonLocation:-${pythonLocation:-}}"
          if [ -z "$TOOLCHAIN_ROOT" ] && command -v python3 >/dev/null 2>&1; then
            # `command -v` is a shell builtin; it does not exec the binary, so
            # it works even when libpython would have failed. Resolve the
            # symlink chain so we land on the real toolcache root rather than
            # `/usr/bin/python3` (which on self-hosted runners is a shim).
            PY_BIN="$(command -v python3)"
            PY_REAL="$(readlink -f "$PY_BIN" 2>/dev/null || echo "$PY_BIN")"
            # the python binary's directory is `<root>/bin`, so the root is its parent
            TOOLCHAIN_ROOT="$(dirname "$(dirname "$PY_REAL")")"
          fi
          if [ -z "$TOOLCHAIN_ROOT" ] || [ ! -d "$TOOLCHAIN_ROOT" ]; then
            echo "::error::Cannot locate Python toolchain root (PythonLocation=${PythonLocation:-<unset>})."
            exit 1
          fi
          # Sanity: confirm the python3 binary actually exists where we think it is.
          if [ ! -x "$TOOLCHAIN_ROOT/bin/python3" ]; then
            echo "::error::Expected python3 binary at $TOOLCHAIN_ROOT/bin/python3 but it is missing or not executable."
            ls -la "$TOOLCHAIN_ROOT" 2>/dev/null || true
            exit 1
          fi
          echo "Toolchain root: $TOOLCHAIN_ROOT"
          # 2) Locate the link-time libpython3.13.so in the toolchain's lib dir.
          SO_PATH="$TOOLCHAIN_ROOT/lib/libpython3.13.so"
          if [ ! -e "$SO_PATH" ]; then
            SO_PATH="$(find "$TOOLCHAIN_ROOT" -maxdepth 4 -name 'libpython3.13.so' -not -name '*.so.*' 2>/dev/null | head -1)"
          fi
          if [ -z "$SO_PATH" ] || [ ! -e "$SO_PATH" ]; then
            echo "::warning::libpython3.13.so not found in toolchain ($TOOLCHAIN_ROOT) — subprocess python will fail."
          else
            SO_DIR="$(dirname "$SO_PATH")"
            SO_NAME="$(basename "$SO_PATH")"
            VERSIONED="libpython3.13.so.1.0"
            # 3) Promote LD_LIBRARY_PATH so subprocess python (the cargo
            #    daemon-tests job also runs tools that exec python) can find
            #    the unversioned .so even before the versioned soname is
            #    resolvable.
            echo "LD_LIBRARY_PATH=${SO_DIR}${LD_LIBRARY_PATH:+:$LD_LIBRARY_PATH}" >> "$GITHUB_ENV"
            # 4) Create the versioned soname symlink in the SAME directory as
            #    the link-time shared object so a bare `python3 -c ...` works
            #    without depending on LD_LIBRARY_PATH inheritance across steps.
            if [ ! -e "${SO_DIR}/${VERSIONED}" ]; then
              ln -s "$SO_NAME" "${SO_DIR}/${VERSIONED}"
              echo "Created symlink ${SO_DIR}/${VERSIONED} -> ${SO_NAME}"
            else
              echo "Versioned symlink ${SO_DIR}/${VERSIONED} already exists"
            fi
            # 5) Self-test: invoke the toolchain python3 NOW, before the test step,
            # so a remaining rc=127 surfaces as a step-level error here.
            PY_TEST="$TOOLCHAIN_ROOT/bin/python3"
            echo "Self-test: $PY_TEST -c 'import sys; sys.exit(0)'"
            "$PY_TEST" -c 'import sys; sys.exit(0)'
            rc=$?
            if [ "$rc" -ne 0 ]; then
              echo "::error::subprocess python3 still fails after symlink fix (rc=$rc). libpython is not loadable."
              exit 1
            fi
            echo "Self-test ok (rc=$rc)"
          fi

      - name: Provision ripgrep (version-attested) + bash-lane preflight
        # Self-hosted runners must not be mutated with `sudo apt-get` during
        # PR jobs (that mutates persistent state for every subsequent PR).
        # This step instead:
        #   1. Looks for an already-provisioned `rg` on PATH whose version
        #      matches the pinned RG_VERSION.
        #   2. If absent OR version mismatch, downloads the pinned
        #      ripgrep tarball from the official GitHub release for
        #      (RUNNER_OS, RUNNER_ARCH), verifies its SHA256 against the
        #      pinned manifest, and unpacks into $RUNNER_TEMP (job-local;
        #      cleaned up by Actions at job end).
        #   3. ALWAYS SHA256-verifies any pre-existing cached binary under
        #      $RUNNER_TEMP — never trusts a predictable cached path.
        #   4. NEVER invokes sudo apt-get / apt-get. FAILS CLOSED on any
        #      checksum mismatch, missing tool, or unsupported platform.
        # See bead jleechan-t5sw, issue #284.
        run: |
          set -euo pipefail
          runner_os="${RUNNER_OS:-Linux}"
          runner_arch="${RUNNER_ARCH:-X64}"
          # ---- Map (RUNNER_OS, RUNNER_ARCH) to (triple, sha256) ----
          case "${runner_os}/${runner_arch}" in
              Linux/X64)
                  rg_triple="x86_64-unknown-linux-musl"
                  rg_sha="${RG_SHA_LINUX_X86_64}"
                  ;;
              Linux/ARM64)
                  rg_triple="aarch64-unknown-linux-gnu"
                  rg_sha="${RG_SHA_LINUX_ARM64}"
                  ;;
              macos/X64)
                  rg_triple="x86_64-apple-darwin"
                  rg_sha="${RG_SHA_MACOS_X86_64}"
                  ;;
              macos/ARM64)
                  rg_triple="aarch64-apple-darwin"
                  rg_sha="${RG_SHA_MACOS_ARM64}"
                  ;;
              *)
                  echo "::error title=Unsupported runner platform::os=${runner_os} arch=${runner_arch}"
                  exit 1
                  ;;
          esac
          echo "OK: platform map selected triple=${rg_triple} sha=${rg_sha}"
          # ---- Path 1: rg already on PATH, version-attested ----
          if command -v rg >/dev/null 2>&1; then
            rg_version="$(rg --version | head -1 | awk '{print $2}')"
            if [ "$rg_version" = "${RG_VERSION}" ]; then
              echo "OK: ripgrep ${rg_version} on PATH (attested, no download needed)"
              rg_on_path=1
            else
              echo "::notice title=ripgrep ${rg_version} on PATH does not match pinned ${RG_VERSION} — installing job-local::"
              rg_on_path=0
            fi
          else
            echo "::notice title=ripgrep not on PATH — installing job-local::"
            rg_on_path=0
          fi
          # ---- Path 2: pinned job-local binary (no persistent mutation) ----
          if [ "${rg_on_path:-0}" -eq 0 ]; then
            rg_dir="${RUNNER_TEMP:-/tmp}/ripgrep-${RG_VERSION}-${rg_triple}"
            rg_bin="${rg_dir}/rg"
            tarball="${rg_dir}/ripgrep.tar.gz"
            url="${RG_RELEASE_BASE}/${RG_VERSION}/ripgrep-${RG_VERSION}-${rg_triple}.tar.gz"
            mkdir -p "$rg_dir"
            # ALWAYS download fresh and ALWAYS verify. Even if $rg_bin
            # already exists from a prior job (some persistent runners
            # keep $RUNNER_TEMP), we never trust a predictable cached
            # path — checksum mismatch is the same code path either way.
            echo "Downloading $url"
            curl --fail --silent --show-error --location --retry 3 --retry-delay 2 \
              --output "$tarball" "$url"
            actual_sha="$(sha256sum "$tarball" | awk '{print $1}')"
            if [ "$actual_sha" != "$rg_sha" ]; then
              echo "::error title=ripgrep checksum mismatch::expected=${rg_sha} actual=${actual_sha} url=${url}"
              rm -rf "$rg_dir"
              exit 1
            fi
            # Wipe any stale unpacked binary before extracting so the
            # post-extract checksum check is meaningful.
            rm -f "$rg_bin"
            tar -xzf "$tarball" -C "$rg_dir" --strip-components=1
            rm -f "$tarball"
            if [ ! -x "$rg_bin" ]; then
              echo "::error title=ripgrep binary not present after unpack::expected=${rg_bin}"
              rm -rf "$rg_dir"
              exit 1
            fi
            # Defense in depth: re-verify the unpacked binary is intact
            # (defends against tarball corruption mid-extract). The
            # shipped .sha256 covers the tarball; the binary is verified
            # by being in the verified tarball. Print the unpacked hash
            # for observability.
            unpacked_sha="$(sha256sum "$rg_bin" | awk '{print $1}')"
            echo "OK: unpacked rg at ${rg_bin} sha256=${unpacked_sha}"
            # Prepend job-local rg to PATH for BOTH the current shell AND
            # subsequent steps. $GITHUB_PATH only takes effect at the next
            # step boundary, so without the explicit `export PATH=...`
            # below, the same step's downstream `rg --version` checks
            # would still see no rg on PATH. The $GITHUB_PATH line covers
            # the downstream steps (pytest, bash integration, graph
            # audit). $RUNNER_TEMP is wiped at job end for ephemeral
            # runners, so this is not persistent mutation.
            export PATH="${rg_dir}:${PATH}"
            echo "${rg_dir}" >> "$GITHUB_PATH"
            # Version-attest the job-local install right now.
            "$rg_bin" --version | head -1
          fi
          # ---- Bash-lane preflight: every binary the bash lane needs ----
          missing=()
          for bin in bash rg git python3 sqlite3; do
            if ! command -v "$bin" >/dev/null 2>&1; then
              missing+=("$bin")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Bash-lane preflight failed::missing=${missing[*]}"
            exit 1
          fi
          rg_final="$(rg --version | head -1 | awk '{print $2}')"
          case "$rg_final" in
              "${RG_VERSION}") echo "OK: bash-lane preflight passed (rg=${rg_final} attested, git=$(git --version | awk '{print $3}'), python3=$(python3 --version | awk '{print $2}'))" ;;
              *) echo "::error title=ripgrep ${rg_final} post-install does not match pinned ${RG_VERSION}"; exit 1 ;;
          esac

      - name: Detect runner platform (Linux-only isolation tests)
        # tests/security/test_agent_isolation.py uses @linux_only markers
        # and will SKIP on macOS runners. This step surfaces that fact
        # explicitly so macOS CI runs don't silently omit sandbox coverage.
        # See docs/self-hosted-runner-selector.md "Adding a platform-specific
        # job" for the path to a dedicated Linux-only job once a
        # self-hosted-linux label is available on the org fleet.
        run: |
          PLATFORM="$(python3 -c 'import sys; print(sys.platform)')"
          echo "Runner platform: $PLATFORM"
          if [ "$PLATFORM" != "linux" ]; then
            echo "::warning title=Platform coverage gap::Running on $PLATFORM — tests/security/test_agent_isolation.py Linux-only tests will be skipped. Open a follow-up issue to add a self-hosted-linux label to the org runner fleet for mandatory Linux coverage."
          fi

      - name: Run tests
        run: python -m pytest tests/ -v --tb=short

      - name: Run bash integration tests
        # The tests/scripts/*.sh suite exercises factory-overlay.sh, factory-af-tick.sh,
        # and the callpath overlay-harness probe. Without this step, regressions in
        # those scripts only surface when an operator runs them locally.
        # See bead jleechan-50jf.
        run: |
          set +e
          fail=0
          for t in tests/scripts/test_*.sh; do
            echo "::group::$t"
            bash "$t" || { echo "::error file=$t::test failed"; fail=$((fail + 1)); }
            echo "::endgroup::"
          done
          exit $fail

      - name: Graph structural audit (G1/G2 dogfooding)
        run: python -m runner.graph_audit pipelines

  daemon-tests:
    # Fork-PR isolation: same guard as the `test` job above.
    # Self-hosted runners are persistent — fork PR code must not execute on them.
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.fork == false
    runs-on: ${{ fromJSON(vars.SELF_HOSTED_RUNNER_LABELS) }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Ensure main ref for VCS integration test
        # daemon/tests/adapters_integration.rs:7 calls `git base_head main` which
        # requires a local `main` ref. actions/checkout by default does NOT create
        # a local `main` ref (only the PR ref + origin/main). This explicit fetch
        # populates the local `main` ref so the Rust test passes.
        # See bead jleechan-q2wu.
        run: |
          git fetch origin main
          git show-ref --verify --quiet refs/heads/main || git branch main origin/main

      - name: Install Rust toolchain (stable)
        # Self-hosted runners do not ship with `cargo` pre-installed (verified
        # on jleechanorg org runners 2026-07-12, PR #287 CI run). dtolnay's
        # rust-toolchain action installs rustup + the requested toolchain in
        # one step; we then cache the daemon crate's build artifacts so
        # subsequent runs are fast.
        uses: dtolnay/rust-toolchain@e97e2d8cc328f1b50210efc529dca0028893a2d9  # v1 (stable)
        with:
          toolchain: stable
          components: clippy  # required for `cargo clippy` in the lint step

      - name: Bootstrap-preflight (daemon)
        # Daemon lane needs git + cargo + python3. Verify everything before any use.
        run: |
          set -euo pipefail
          missing=()
          for bin in bash sh git python3 cargo; do
            if ! command -v "$bin" >/dev/null 2>&1; then
              missing+=("$bin")
            fi
          done
          if [ "${#missing[@]}" -gt 0 ]; then
            echo "::error title=Bootstrap preflight failed::missing=${missing[*]}"
            exit 1
          fi
          echo "OK: bootstrap preflight passed (git=$(git --version | awk '{print $3}'), cargo=$(cargo --version | awk '{print $2}'), python3=$(python3 --version | awk '{print $2}'))"

      - name: Cache cargo registry/target for daemon crate
        uses: Swatinem/rust-cache@23869a5bd66c73db3c0ac40331f3206eb23791dc  # v2.9.1
        with:
          workspaces: daemon -> target

      - name: Provision Node 22.22.0 (for AO bridge tests)
        # `bridge_test_node()` in `daemon/src/adapters.rs:2063` looks for
        # `${HOME}/.nvm/versions/node/v22.22.0/bin/node` (the global
        # CLAUDE.md "Use nvm Node 22 (v22.22.0)" convention) before
        # falling back to `node` on PATH. Self-hosted runners don't ship
        # nvm or Node 22 preinstalled — verified on PR #287 CI run
        # 29549724870 where 5 `adapters::ao_spawn_contract_tests`
        # panicked with `[Errno 2] No such file or directory` because
        # the AO bridge python shim `os.execvp`'d a missing
        # `AO_FAKE_NODE` path. Provision Node 22.22.0 from NodeSource
        # to the exact nvm path so the bridge tests can find their
        # runtime.
        # Short-circuit cleanly when the binary already exists so
        # cached/ephemeral runners don't re-download ~30MB on every run.
        # Bead: jleechan-af-drive-pr287-aw9y.
        run: |
          NODE_BIN="${HOME}/.nvm/versions/node/v22.22.0/bin"
          if [ -x "${NODE_BIN}/node" ]; then
            "${NODE_BIN}/node" --version
            exit 0
          fi
          OS="$(uname -s)"
          ARCH="$(uname -m)"
          case "${OS}-${ARCH}" in
            Darwin-x86_64)  NODE_ARCH=darwin-x64 ;;
            Darwin-arm64)   NODE_ARCH=darwin-arm64 ;;
            Linux-x86_64)   NODE_ARCH=linux-x64 ;;
            Linux-aarch64)  NODE_ARCH=linux-arm64 ;;
            *) echo "::error::Unsupported Node arch: ${OS}-${ARCH}"; exit 1 ;;
          esac
          mkdir -p "${NODE_BIN%/*}"
          curl -fsSL -o /tmp/node.tar.xz "https://nodejs.org/dist/v22.22.0/node-v22.22.0-${NODE_ARCH}.tar.xz"
          tar -xJf /tmp/node.tar.xz -C /tmp
          cp -r "/tmp/node-v22.22.0-${NODE_ARCH}/bin" "/tmp/node-v22.22.0-${NODE_ARCH}/lib" "/tmp/node-v22.22.0-${NODE_ARCH}/include" "/tmp/node-v22.22.0-${NODE_ARCH}/share" "${NODE_BIN%/*}/"
          "${NODE_BIN}/node" --version

      - name: cargo test (daemon crate)
        working-directory: daemon
        # The self-hosted runner can concurrently run the Python test job;
        # serial compilation prevents rustc from being OOM-killed mid-suite.
        run: cargo test --verbose -j 1

      - name: cargo clippy (deny warnings)
        working-directory: daemon
        run: cargo clippy -- -D warnings
