name: Skeptic Gate

on:
  pull_request:
    branches: [main]

jobs:
  skeptic:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write
    env:
      DISABLE_SANDBOX: "1"
      DARK_FACTORY_HOLDOUTS: "${{ github.workspace }}/tests/fixtures/holdout-eval"
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55  # v5.5.0
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests (skeptic pass/fail gate)
        id: tests
        run: |
          python -m pytest tests/ -v --tb=short 2>&1 | tee /tmp/skeptic-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -eq 0 ]; then
            echo "verdict=PASS" >> $GITHUB_OUTPUT
          else
            echo "verdict=FAIL" >> $GITHUB_OUTPUT
          fi
          exit $EXIT_CODE

      - name: Post skeptic verdict
        if: always() && github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/github-script@60a0d83039c74a4aee543508d2ffcb1c3799cdea  # v7.0.1
        with:
          script: |
            const verdict = '${{ steps.tests.outputs.verdict }}' || 'FAIL';
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('/tmp/skeptic-output.txt', 'utf8').slice(-2000);
            } catch (e) {}
            const body = `### Skeptic Gate\n\nVERDICT: ${verdict}\n\n<details><summary>Test output</summary>\n\n\`\`\`\n${output}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });
