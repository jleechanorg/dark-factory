# SHA-bound Skeptic gate — see issue #278.
#
# BOOTSTRAP CONSTRAINT (per the post-audit bootstrap-audit):
#
#   This workflow is intentionally NOT triggered by `pull_request` or
#   `pull_request_target`. PR-controlled YAML is forgeable; the only
#   legitimate bootstrap is via an EXTERNAL TRUSTED CALLER that invokes
#   this workflow through `workflow_call` once the trusted default
#   branch already contains this file plus `runner/skeptic_gate*.py`.
#
#   Until then, gate-7 cannot be self-certified by PR #281's own
#   workflow. The dark-factory 7-green policy requires a separate seed
#   in `jleechanorg/.github` (Hermes reusable workflow) that calls
#   `jleechanorg/dark-factory/.github/workflows/skeptic-gate.yml@main`
#   from the trusted context. See `docs/skeptic-gate.md` §
#   "Bootstrap dependency".
#
# INPUTS (workflow_call + workflow_dispatch):
#   pr_number  — required, PR number to (re-)run skeptic on
#   pr_sha     — optional, head SHA override; if empty, re-resolved
#                via `gh pr view` from the API
#   trusted_ref — optional, ref to sparse-checkout gate code from
#                 (defaults to the repo's default branch)
#
# TRIGGER POSTURE:
#   workflow_call       — for trusted external callers (Hermes reusable).
#   workflow_dispatch   — for manual operator re-runs (diagnostic only).
#   pull_request        — INTENTIONALLY ABSENT (forgeable).
#   pull_request_target — INTENTIONALLY ABSENT (cannot bootstrap; gate
#                         itself is the asset being added).

name: skeptic

on:
  workflow_call:
    inputs:
      pr_number:
        description: "PR number to (re-)run skeptic on"
        required: true
        type: string
      pr_sha:
        description: "Optional PR head SHA override; if empty, re-resolved via gh pr view"
        required: false
        type: string
        default: ""
      trusted_ref:
        description: "Ref to sparse-checkout the gate code from (defaults to default branch)"
        required: false
        type: string
        default: ""
    secrets:
      # Pass-through secret. The trusted caller decides which secrets
      # to forward; this workflow treats `secrets.GITHUB_TOKEN` as the
      # only one it actually uses for posting comments + statuses.
      github_token:
        description: "GitHub token for posting comment + status (default: workflow-provided GITHUB_TOKEN)"
        required: false
  workflow_dispatch:
    inputs:
      pr_number:
        description: "PR number to (re-)run skeptic on"
        required: true
        type: string
      pr_sha:
        description: "Optional PR head SHA override; if empty, re-resolved via gh pr view"
        required: false
        type: string
      trusted_ref:
        description: "Ref to sparse-checkout the gate code from (defaults to default branch)"
        required: false
        type: string

# Concurrency keyed per PR (newer run cancels older for the same PR so
# the freshest verdict wins). Note: this only dedupes our own runs;
# the external trusted caller has its own concurrency group.
concurrency:
  group: skeptic-pr-${{ inputs.pr_number }}
  cancel-in-progress: true

permissions:
  contents: read
  pull-requests: write
  statuses: write

jobs:
  skeptic:
    name: Skeptic (SHA-bound PASS/FAIL)
    runs-on: ${{ fromJson(vars.SELF_HOSTED_RUNNER_LABELS || '["self-hosted","self-hosted-mikey"]') }}
    timeout-minutes: 30
    env:
      SKEPTIC_REVIEWERS_JSON: '[["codex",""],["gemini","gemini-2.5-pro"]]'
      SKEPTIC_STATUS_CONTEXT: "skeptic"
    steps:
      - name: Verify reviewer CLIs are pre-installed (no install)
        # The reviewer CLIs (codex, gemini) are EXPECTED to be already
        # installed on the runner image the trusted caller selects.
        # We deliberately do NOT `npm install -g` here — a mutable
        # install on a credentialed runner is not pinned and not
        # fail-closed. If the runner image lacks them, the reviewer
        # invocation below fails closed with 'reviewer unavailable',
        # which the gate treats as a FAIL (correct fail-closed
        # contract).
        run: |
          set -euo pipefail
          missing=0
          for cli in codex gemini; do
            if ! command -v "$cli" >/dev/null 2>&1; then
              echo "[skeptic-gate] $cli MISSING on runner (expected pre-installed)"
              missing=1
            else
              echo "[skeptic-gate] $cli present: $($cli --version || echo unknown)"
            fi
          done
          # This is observational — do NOT install. Fail-closed happens
          # later via reviewer-unavailable → check_state=failure.
          exit 0

      - name: Checkout gate code from TRUSTED ref (not PR head)
        # Sparse-checkout pulls only the gate's Python files from the
        # trusted ref (default branch by default; the trusted caller
        # can pin a specific SHA via `inputs.trusted_ref`). PR head
        # Python is NEVER checked out — an attacker who controls PR
        # head cannot pivot this credentialed runner into executing
        # their code.
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683  # v4.2.2
        with:
          ref: ${{ inputs.trusted_ref || github.event.repository.default_branch }}
          sparse-checkout: |
            runner/skeptic_gate.py
            runner/skeptic_gate_cli.py
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@8d9ed9ac5c53483de85588cdf95a591a75ab9f55  # v5.5.0
        with:
          python-version: "3.12"

      - name: Run skeptic gate
        id: gate
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN || secrets.github_token }}
          PR_NUMBER: ${{ inputs.pr_number }}
          PR_HEAD_SHA: ${{ inputs.pr_sha }}
          SKEPTIC_REVIEWERS_JSON: ${{ env.SKEPTIC_REVIEWERS_JSON }}
          SKEPTIC_STATUS_CONTEXT: ${{ env.SKEPTIC_STATUS_CONTEXT }}
        run: |
          set -euo pipefail
          python -m runner.skeptic_gate_cli \
            --repo "$GITHUB_REPOSITORY" \
            --pr-number "${PR_NUMBER}" \
            --pr-sha "${PR_HEAD_SHA}" \
            --reviewers-json "${SKEPTIC_REVIEWERS_JSON}" \
            --status-context "${SKEPTIC_STATUS_CONTEXT}"
