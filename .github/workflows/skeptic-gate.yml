name: Skeptic Gate

on:
  pull_request:
    branches: [main]

jobs:
  skeptic:
    runs-on: ubuntu-latest
    permissions:
      pull-requests: write
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pytest

      - name: Run tests (skeptic pass/fail gate)
        id: tests
        run: |
          python -m pytest tests/ -v --tb=short 2>&1 | tee /tmp/skeptic-output.txt
          EXIT_CODE=${PIPESTATUS[0]}
          if [ $EXIT_CODE -eq 0 ]; then
            echo "verdict=PASS" >> $GITHUB_OUTPUT
          else
            echo "verdict=FAIL" >> $GITHUB_OUTPUT
          fi
          exit $EXIT_CODE

      - name: Post skeptic verdict
        if: always()
        uses: actions/github-script@v7
        with:
          script: |
            const verdict = '${{ steps.tests.outputs.verdict }}' || 'FAIL';
            const fs = require('fs');
            let output = '';
            try {
              output = fs.readFileSync('/tmp/skeptic-output.txt', 'utf8').slice(-2000);
            } catch (e) {}
            const body = `### Skeptic Gate\n\nVERDICT: ${verdict}\n\n<details><summary>Test output</summary>\n\n\`\`\`\n${output}\n\`\`\`\n\n</details>`;
            await github.rest.issues.createComment({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.payload.pull_request.number,
              body: body
            });
