target_repo = "jleechanorg/worldarchitect.ai"
ao_project = "worldarchitect"
base_branch = "main"
stage = 2
max_workers = 80
max_batch = 25
fast_tick_secs = 10
slow_tick_secs = 30
autonomy_timebox_secs = 10800
budget_warn_usd = 20.0
spec_dir = ".factory/specs/"

# Multi-repo dispatch routing (bead jleechan-35y4 Stage B, PRs #245/#249/#250;
# consumer merged; entries added live 2026-07-15 after unmapped_target_repo parks).
# push_remote for worldarchitect.ai is "worldai", NOT "origin" -- that clone's
# origin remote points at jleechanclaw (a different repo entirely).
[repos."jleechanorg/worldarchitect.ai"]
ao_project = "worldarchitect"
push_remote = "worldai"

[repos."jleechanorg/dark-factory"]
ao_project = "dark-factory"
push_remote = "origin"

# Multi-machine CLAIMED tag coordination (bead jleechan-g1ib). One tagger
# per machine runs `bin/claimd` against the daemon-cxdb.sqlite shared with
# this factory daemon. Each machine has its own `claimed-by:<machine>`
# label; the daemon only refuses a claim when the LOCAL overlay says the
# bead is already held (within ttl_minutes) OR the peer's last /sync
# reported the bead as held by the other machine. unset peer = single-
# machine mode (no peer sync). On jeff-ubuntu port=7821; on mac port=7822.
[claim]
ttl_minutes = 30
heartbeat_seconds = 600
gh_reapply_minutes = 10
sync_seconds = 60
[claim.jeff-ubuntu]
hostname = "jeff-ubuntu"
daemon_port = 7821
peer_host = "mac.lan"
peer_port = 7822
[claim.mac]
hostname = "mac"
daemon_port = 7822
peer_host = "jeff-ubuntu.lan"
peer_port = 7821
