# Caps cargo build/test parallelism for the daemon crate.
#
# Without this, `cargo test --release` spawns one rustc invocation per
# integration-test binary (daemon, constraint_fuzz, intake,
# adapters_integration, tools_fakes, er_runner_integration,
# reroll_integration, tick_integration, ...), each defaulting to using all
# detected logical CPUs. On a shared host that multiplies out past the
# actual core count and starves everything else running on the box.
#
# Confirmed twice on 2026-07-10 (jleechanorg/dark-factory#220): a bare
# `cargo test --release --manifest-path daemon/Cargo.toml` on jeff-ubuntu
# (32 logical CPUs) spiked load average to 48, making the host unresponsive
# to SSH for several minutes.
#
# 2 leaves headroom for other work on every host we ship CI to:
# GitHub-hosted ubuntu-24.04 runners expose 4 logical CPUs, so any value
# >= 4 would not actually cap on the smallest shared host and would
# re-trigger the starvation pattern (RED: PR #222 daemon-tests job
# 86446729028 — `jobs = 8` failed the cap-below-nproc invariant on a
# 4-vCPU runner). 2 is also the right per-job allowance on a 32-thread
# box with ~16 concurrent self-hosted CI runners — each runner gets 2
# jobs and significant headroom remains. Override locally with
# `cargo build -j <N>` / `CARGO_BUILD_JOBS=<N>` if you have a dedicated box.
[build]
jobs = 2
