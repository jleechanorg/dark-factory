[package]
name = "daemon"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "vacuous_test_detector"
path = "src/bin/vacuous_test_detector.rs"

[[bin]]
name = "vacuous_red_green"
path = "src/bin/vacuous_red_green.rs"

[[bin]]
name = "claimd"
path = "src/bin/claimd.rs"

[dependencies]
rusqlite = { version = "0.32", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
toml = "0.8"
thiserror = "2"
