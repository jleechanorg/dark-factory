operator_verification:
  schema_version: 1
  commands:
    - id: worker-safe-targeted
      argv:
        - .venv/bin/pytest
        - -q
        - tests/test_subprocess_control.py
        - tests/test_engine.py
        - tests/test_cli_fallbacks.py
        - tests/test_two_node_dot.py
        - tests/test_graph_audit.py
        - tests/test_graph_controller_integration.py
        - tests/test_review_controller.py
        - tests/test_gate_subprocess_dispatch.py
        - tests/test_gate_infra_failure.py
        - tests/test_ao_sandbox.py
        - tests/test_codergen_shadow_review.py
        - tests/test_parallel_codex_reviewer.py
        - tests/test_hardening.py
        - tests/test_gate_agy_fallback.py
        - tests/test_gate_audit.py
        - tests/test_gate_slash.py
        - tests/test_gate_universal_prompts.py
        - tests/test_ok8.py
        - --deselect=tests/test_cli_fallbacks.py::test_controller_outer_sandbox_enforces_read_and_write_boundaries
        - --deselect=tests/test_cli_fallbacks.py::test_controller_outer_sandbox_avoids_nested_seatbelt
        - --deselect=tests/test_cli_fallbacks.py::test_controller_protects_linked_git_metadata_and_artifact_lane
        - --deselect=tests/test_ao_sandbox.py::test_fake_ao_shim_cannot_read_holdouts_under_sandbox
        - --deselect=tests/test_hardening.py::test_tool_handler_tolerates_bad_timeout
        - --deselect=tests/test_hardening.py::test_visible_all_nodes_benchmark_has_no_embedded_holdout_contract
      lane: worker_safe
      timeout_seconds: 600
      classification: required
    - id: operator-unwrapped-six
      argv:
        - .venv/bin/pytest
        - -q
        - tests/test_cli_fallbacks.py::test_controller_outer_sandbox_enforces_read_and_write_boundaries
        - tests/test_cli_fallbacks.py::test_controller_outer_sandbox_avoids_nested_seatbelt
        - tests/test_cli_fallbacks.py::test_controller_protects_linked_git_metadata_and_artifact_lane
        - tests/test_ao_sandbox.py::test_fake_ao_shim_cannot_read_holdouts_under_sandbox
        - tests/test_hardening.py::test_tool_handler_tolerates_bad_timeout
        - tests/test_hardening.py::test_visible_all_nodes_benchmark_has_no_embedded_holdout_contract
      lane: operator_unwrapped
      timeout_seconds: 300
      classification: required
  exclusions:
    - id: bounded-conformance
      classification: excluded
      reason: Bounded conformance remains a separately reported acceptance lane, not a passing operator command.
    - id: private-self-hosted-runner
      classification: excluded
      reason: Private-repository GitHub Actions are expected to use self-hosted runners and require separate live CI evidence.
